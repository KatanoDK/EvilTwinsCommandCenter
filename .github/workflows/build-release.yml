name: Build addon and updater

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-build-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Lua, crafting groups, loot wishlist, SimC, roster UI, and raid prep
        run: |
          python -m pip install lupa==2.6
          python tests/test_crafting.py
          python tests/test_app_source_hash.py
      - name: Test updater installation and downloads
        run: dotnet run --project updater/EvilTwinsUpdater.Tests/EvilTwinsUpdater.Tests.csproj -c Release -- .test-work/install-tests
      - name: Package addon
        run: |
          python scripts/package_addon.py
          Copy-Item -LiteralPath dist/EvilTwinsCommandCenter-0.1.0.zip -Destination dist/EvilTwinsCommandCenter.zip
      - name: Publish installed Windows updater when app source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_updater.ps1
      - name: Release this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_SHA"
          @'
          Development build — addon version 0.1.0. In-game testing is still required.

          Install the updater once using [EvilTwinsUpdater-Setup.exe](https://github.com/KatanoDK/EvilTwinsCommandCenter/releases/download/updater/EvilTwinsUpdater-Setup.exe). Exit your old portable updater before installing. The app creates shortcuts and can update itself with Update app & restart. Choose your WoW _retail_ folder once. Addon updates can install while WoW is open; type /reload afterward. Keep the updater open or minimized for automatic checks. No GitHub login is needed.

          For manual installation, extract EvilTwinsCommandCenter.zip into Retail's Interface/AddOns folder.
          '@ | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/EvilTwinsCommandCenter.zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag dist/EvilTwinsCommandCenter.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Development build $($env:GITHUB_SHA.Substring(0,8))" --prerelease --notes-file dist/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
